name: CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/emergencyq-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/emergencyq-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.run_number }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.run_number }}
            ${{ env.FRONTEND_IMAGE }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 15m
          script: |
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            
            # Apply core manifests (no Grafana — saves ~287MB RAM on t3.small)
            sudo kubectl apply -f /home/ubuntu/k3s/namespace.yaml -n emergencyq 2>/dev/null || true
            sudo kubectl apply -f /home/ubuntu/k3s/configmap.yaml -n emergencyq 2>/dev/null || true
            sudo kubectl apply -f /home/ubuntu/k3s/secret.yaml -n emergencyq 2>/dev/null || true
            sudo kubectl apply -f /home/ubuntu/k3s/backend-deployment.yaml -n emergencyq 2>/dev/null || true
            sudo kubectl apply -f /home/ubuntu/k3s/backend-service.yaml -n emergencyq 2>/dev/null || true
            sudo kubectl apply -f /home/ubuntu/k3s/frontend-deployment.yaml -n emergencyq 2>/dev/null || true
            sudo kubectl apply -f /home/ubuntu/k3s/frontend-service.yaml -n emergencyq 2>/dev/null || true
            sudo kubectl apply -f /home/ubuntu/k3s/prometheus-configmap.yaml -n emergencyq 2>/dev/null || true
            sudo kubectl apply -f /home/ubuntu/k3s/prometheus-deployment.yaml -n emergencyq 2>/dev/null || true
            sudo kubectl apply -f /home/ubuntu/k3s/ingress.yaml -n emergencyq 2>/dev/null || true
            
            # Update Deployments with new image tag
            sudo kubectl set image deployment/emergencyq-backend backend=${{ env.BACKEND_IMAGE }}:${{ github.run_number }} -n emergencyq
            sudo kubectl set image deployment/emergencyq-frontend frontend=${{ env.FRONTEND_IMAGE }}:${{ github.run_number }} -n emergencyq
            
            # Wait for rollout
            sudo kubectl rollout status deployment/emergencyq-backend -n emergencyq --timeout=900s
            sudo kubectl rollout status deployment/emergencyq-frontend -n emergencyq --timeout=300s
