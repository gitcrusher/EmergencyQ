#  docker-compose.yml — EmergencyQ
#
#  Docker Compose builds and runs multiple services (Backend, Frontend, Prometheus, Grafana) using a single command.
#
#  Command: docker-compose up --build
#  Band:    docker-compose down

services:

  # BACKEND (FastAPI) 
  backend:
    image: emergencyq-backend:v2
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - ../.env # DATABASE_URL, API keys etc.
    restart: unless-stopped

  # FRONTEND (React + Nginx)
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend # first backend then frontend starting
    restart: unless-stopped

  # PROMETHEUS (Metrics Collector)
  prometheus:
    image: prom/prometheus:latest
    # ports: intentionally removed — internal only
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

  # grafana
  grafana:
    image: grafana/grafana:latest
    # ports: intentionally removed — internal only
    expose:
      - "3000" # Only reachable inside Docker network
    env_file:
      - ../.env
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  grafana_data:
