# nginx.conf — EmergencyQ Frontend
#
# 1. Serves React build files
# 2. Proxies /api/* to backend (hostname set via BACKEND_HOST env var)
# 3. Falls back to index.html for React Router (SPA support)
#
# BACKEND_HOST is injected at container start via envsubst:
#   Docker Compose → BACKEND_HOST=backend
#   Kubernetes     → BACKEND_HOST=emergencyq-backend-svc

server {

    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # React Router: return index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Proxy: forward /api/* to backend service
    location /api/ {
        proxy_pass http://${BACKEND_HOST}:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

}
