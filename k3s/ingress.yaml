# ingress.yaml
# Routes incoming internet traffic to the right internal service.
#   /api/*    → Backend (FastAPI)
#   /metrics  → Backend (Prometheus scraping)
#   /         → Frontend (React/Nginx)
#
# k3s comes with Traefik built-in, so no extra ingress controller needed.
# To add HTTPS later, uncomment the cert-manager annotation and set up Let's Encrypt.
#
# Apply: kubectl apply -f k3s/ingress.yaml -n emergencyq

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: emergencyq-ingress
  namespace: emergencyq
  labels:
    app: emergencyq
  annotations:
    kubernetes.io/ingress.class: "traefik"  # k3s default ingress controller
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"  # Uncomment for HTTPS

spec:
  rules:
    - http:
        paths:
          # API traffic → Backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: emergencyq-backend-svc
                port:
                  number: 8000

          # Prometheus metrics → Backend
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: emergencyq-backend-svc
                port:
                  number: 8000

          # Everything else → Frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: emergencyq-frontend-svc
                port:
                  number: 80
