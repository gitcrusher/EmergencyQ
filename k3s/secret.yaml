# ══════════════════════════════════════════════
#  secret.yaml — EmergencyQ
#
#  Secret kya hai?
#  Sensitive data (passwords, API keys, DB URL)
#  store karta hai — ENCRYPTED.
#
#  ConfigMap vs Secret:
#    ConfigMap = plain text (LOG_LEVEL, PORT — koi dekh le koi farak nahi)
#    Secret    = base64 encoded (passwords — secure rakhna zaroori)
#
#  ⚠️ IMPORTANT:
#  Ye file mein PLACEHOLDER values hain.
#  Production mein ye file Git mein NAHI daalte.
#  Instead, kubectl command se directly create karte hain:
#
#    kubectl create secret generic emergencyq-secrets \
#      --from-literal=DATABASE_URL="postgresql://user:pass@host:5432/db" \
#      --namespace=emergencyq
#
#  Apply: kubectl apply -f k8s/secret.yaml -n emergencyq
# ══════════════════════════════════════════════

apiVersion: v1
kind: Secret
metadata:
  name: emergencyq-secrets
  namespace: emergencyq
  labels:
    app: emergencyq
type: Opaque

# ⚠️ Values base64 mein honi chahiye
# Encode: echo -n "your_value" | base64
# Decode: echo "encoded_value" | base64 --decode
stringData:
  # stringData = plain text likh sakte ho, K8s khud base64 karega
  DATABASE_URL: "postgresql://emergencyq_admin:CHANGE_ME@your-rds-endpoint:5432/emergencyq_db"
  GROQ_API_KEY: "CHANGE_ME_your_groq_api_key"
  VITE_API_URL: "http://your-backend-url:8000"
